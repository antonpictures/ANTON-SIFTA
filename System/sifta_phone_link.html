<!doctype html>
<html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><title>Alice | Telefon local</title>
<style>
:root{--bg:#f6f2e9;--card:#fffcf6;--fg:#292822;--muted:#726b61;--accent:#a24927;--line:#d8cfbf;font-family:Avenir,'Trebuchet MS',sans-serif;color:var(--fg);background:var(--bg)}
@media(prefers-color-scheme:dark){:root{--bg:#211f1c;--card:#2b2824;--fg:#eee8dc;--muted:#b7ab9b;--accent:#edac85;--line:#51473d}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#ad623015,transparent 70%);min-height:100dvh}main{max-width:780px;margin:auto;padding:24px 18px 200px}header{border-bottom:1px solid var(--line);padding-bottom:18px}h1{font:2.8rem Georgia,serif;margin:8px 0}small,.meta{color:var(--muted)}.eyebrow{letter-spacing:.16em;font-size:.72rem;font-weight:bold}#status{margin:12px 0;font-size:.9rem;color:var(--accent)}article{margin:22px 0;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}.user{margin-left:12%}.content{white-space:pre-wrap;line-height:1.6}.role{font-size:.72rem;letter-spacing:.12em;margin-bottom:10px;color:var(--muted)}form{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,780px);padding:12px 18px max(14px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}textarea{width:100%;resize:vertical;max-height:25vh;border:1px solid var(--line);border-radius:15px;padding:14px;font:inherit;font-size:16px;background:var(--card);color:var(--fg)}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}button{padding:12px 22px;border-radius:24px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);font:inherit;font-weight:bold}button:disabled{opacity:.45}#connect{margin:12px 0}#empty{font:1.4rem Georgia,serif;color:var(--muted);padding:32px 0}#error{color:var(--accent);white-space:pre-wrap}#pilot{margin:14px 0;width:100%;background:transparent;color:var(--accent)}#voice.off{background:transparent;color:var(--accent);opacity:.75}
</style>
<main><header><span class="eyebrow">SIFTA / LEGATURA LOCALA</span><h1>Alice, aproape.</h1><small>Telefonul este ecranul. Modelul ruleaza pe laptop.</small><div id="status" role="status">Se verifica legatura...</div><small id="model"></small><button id="pilot" hidden>🧭 Pilot: Alice ma conduce</button></header>
<button id="connect" hidden>Conecteaza acest telefon</button><p id="error" role="alert"></p><section id="wall" aria-live="polite"></section><p id="empty">Cu ce incepem?</p></main>
<form id="form"><textarea id="text" rows="2" maxlength="4000" placeholder="Scrie-i lui Alice..." aria-label="Mesaj" required></textarea><div class="bar"><small>Doar Wi-Fi de incredere. HTTP necriptat.</small><button id="voice" type="button">🗣 Voce</button><button id="send" disabled>Trimite</button></div></form>
<script>
const $=id=>document.getElementById(id);let paired=false,pending=false,last='',draftId=null;
// 2026-09-18 pilot lane: Alice issues one movement command per reply and the
// phone speaks it through its speakers; the owner walks and answers "gata".
const PILOT='Porneste modul pilot: tu esti creierul, eu sunt picioarele tale (corpul tau uman, ca in Mad Max). Da-mi comenzi de mers ca sa inveti incaperea: INAINTE / INAPOI / STANGA / DREAPTA, cu numarul de pasi sau de grade, apoi STOP. O singura comanda scurta per raspuns. Dupa fiecare comanda scriu "gata" plus ce vad; foloseste observatiile primite ca sa corectezi traiectoria si sa memorezi incaperea. Incepe acum cu prima comanda.';
let voiceOn=localStorage.getItem('sifta.voice')==='1',spoken=new Set(),firstRender=true;
function say(text){if(!voiceOn||!('speechSynthesis' in window)||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const rv=speechSynthesis.getVoices().find(v=>(v.lang||'').toLowerCase().startsWith('ro'));if(rv)u.voice=rv;u.lang=rv?rv.lang:(/[ăâîșț]/i.test(text)?'ro-RO':'');speechSynthesis.speak(u)}catch(e){}}
function paintVoice(){const b=$('voice');b.textContent=voiceOn?'🔊 Voce pornita':'🗣 Porneste vocea';b.classList.toggle('off',!voiceOn)}
$('voice').onclick=()=>{voiceOn=!voiceOn;localStorage.setItem('sifta.voice',voiceOn?'1':'0');paintVoice();if(voiceOn)say('Vocea mea este activa. Sunt Alice. Voi conduce.')};
let ticket=new URLSearchParams(location.hash.slice(1)).get('pair');history.replaceState(null,'',location.pathname);
async function api(path,body){const r=await fetch(path,{cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'Conexiune indisponibila');return data}
function render(rows){const key=JSON.stringify(rows);if(key===last)return;last=key;$('wall').replaceChildren();for(const r of rows){const a=document.createElement('article');a.className=r.role;const label=document.createElement('div');label.className='role';label.textContent=r.role==='user'?'TU':r.role==='assistant'?'ALICE':'STARE';const c=document.createElement('div');c.className='content';c.textContent=r.content;a.append(label,c);if(r.truncated){const note=document.createElement('small');note.textContent='Raspuns partial: bugetul local de generare s-a incheiat.';a.append(note)}$('wall').append(a)}$('empty').hidden=rows.length>0;if(firstRender){for(const r of rows)if(r.id)spoken.add(r.id);firstRender=false}else{const fresh=rows.filter(r=>(r.role==='assistant'||r.role==='notice')&&r.id&&!spoken.has(r.id));for(const r of fresh)spoken.add(r.id);if(fresh.length)say(fresh[fresh.length-1].content)}}
async function refresh(){try{const d=await api('/api/history');paired=true;pending=d.pending;render(d.history);$('model').textContent=d.model;$('status').textContent=pending?'Alice raspunde pe laptop...':'Conectat local';$('send').disabled=pending;$('pilot').hidden=false;if(!ticket)$('connect').hidden=true}catch(e){paired=false;$('send').disabled=true;$('pilot').hidden=true;$('status').textContent='Neconectat';$('error').textContent=ticket?'Apasa Conecteaza. Codul expira dupa 5 minute.':'Scaneaza un cod QR nou din SIFTA > Settings > Network.'}}
if(ticket)$('connect').hidden=false;
$('connect').onclick=async()=>{try{await api('/api/pair',{ticket});ticket=null;$('connect').hidden=true;$('error').textContent='';await refresh()}catch(e){$('error').textContent=e.message}};
async function send(){if(!paired||pending)return;const text=$('text').value.trim();if(!text)return;draftId=draftId||Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');$('send').disabled=true;try{await api('/api/chat',{text,request_id:draftId});draftId=null;$('text').value='';$('error').textContent='';await refresh()}catch(e){$('error').textContent=e.message;$('send').disabled=false}}
$('form').onsubmit=async e=>{e.preventDefault();await send()};
$('pilot').onclick=()=>{if(!paired||pending)return;$('text').value=PILOT;send()};
$('text').addEventListener('input',()=>{draftId=null});paintVoice();refresh();setInterval(refresh,2500);
</script></html>
