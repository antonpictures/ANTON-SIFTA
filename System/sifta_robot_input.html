<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alice</title>
<style>
:root{color-scheme:dark;--bg:#111;--ink:#eee;--panel:#222;--line:#444;--accent:#e8a580;--good:#176b3a}
*{box-sizing:border-box}html{height:100%;overflow:hidden}body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.35 "Avenir Next",sans-serif}
main{height:100svh;max-width:980px;margin:auto;padding:6px;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:4px}
.stage{position:relative;overflow:hidden;border-radius:12px}
video{display:block;width:100%;height:100%;min-height:200px;background:#000;object-fit:cover}
#caption{position:absolute;left:6px;right:6px;bottom:6px;z-index:3;background:rgba(0,0,0,.75);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;line-height:1.4;text-align:center;pointer-events:none;display:none}
#caption.show{display:block}
.controls{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.controls button{cursor:pointer;margin:0;touch-action:manipulation;font:inherit;border:1px solid var(--line);border-radius:20px;padding:8px 14px;background:var(--panel);color:var(--ink);font-size:13px}
.controls button.on{background:var(--accent);color:#111;border-color:var(--accent)}
.controls .start{background:var(--good);color:#fff;border-color:var(--good);font-weight:800}
.controls .start.is-on{background:var(--accent);border-color:var(--accent)}
.controls .icon{width:34px;height:34px;border-radius:50%;padding:0;font-size:15px}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:end}
textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel);color:var(--ink);width:100%;min-height:34px;height:34px;resize:none}
.composer button{border-radius:10px;padding:8px 16px;background:var(--good);color:#fff;border-color:var(--good);font-weight:800;font-size:13px}
#status{color:#888;font-size:10px;min-height:10px;grid-column:1/-1;margin:0}
</style>
</head>
<body><main>
<div class="stage">
  <video id="camera" playsinline muted autoplay></video>
  <div id="caption" role="status"></div>
</div>
<div class="controls">
  <button id="start" class="start">🎥</button>
  <button id="ear" class="on">👂</button>
  <button id="voice" title="Alice speaks">🔇</button>
  <button id="flip">↻</button>
</div>
<section class="composer">
  <textarea id="text" placeholder="Type to Alice..."></textarea>
  <button id="send">Send</button>
  <p id="status" role="status"></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const SESSION_KEY='sifta.robot.session',OWNER_KEY='sifta.owner.session',EAR_KEY='sifta_phone_ear',VOICE_KEY='sifta_phone_voice';
const BATCH_MS=20000,MIN_MS=10000,MAX_MS=60000,STEP_MS=5000;
let cameraStream=null,audioStream=null,recorder=null,sending=false,stopped=false,generation=0,sensorActive=false,telemetryEnabled=false;
let latestMotion=null,latestOrientation=null,latestLocation=null,latestBattery=null,locationWatchId=null;
let batchTimer=null,batchInFlight=false,batchSequence=0,cameraFacing='environment',blackStreak=0,lastFlip=0;
let cadenceMs=Math.min(MAX_MS,Math.max(MIN_MS,Number(localStorage.getItem(CADENCE_KEY))||BATCH_MS));
let polling=false,faceDetector=null,faceState='unknown',noFace=0;
let observationTurns=new Map(),pendingObs=false;
const session=localStorage.getItem(SESSION_KEY)||(()=>{const s=crypto.randomUUID();localStorage.setItem(SESSION_KEY,s);return s;})();
function status(t){$('status').textContent=t;}
function updateStartBtn(){const b=$('start');if(sensorActive){b.textContent='⏸';b.classList.add('is-on');}else{b.textContent='🎥';b.classList.remove('is-on');}}
function updateEarBtn(){const on=localStorage.getItem(EAR_KEY)!=='off';$('ear').textContent='👂';$('ear').classList.toggle('on',on);}
function updateVoiceBtn(){const on=localStorage.getItem(VOICE_KEY)==='on';$('voice').textContent=on?'🔊':'🔇';$('voice').classList.toggle('on',on);}
function updateFlipBtn(){$('flip').disabled=!cameraStream;}
function snapshotTelemetry(){const s={};if(latestMotion)s.acceleration={x:latestMotion.x,y:latestMotion.y,z:latestMotion.z};if(latestOrientation)s.orientation={alpha:latestOrientation.alpha,beta:latestOrientation.beta,gamma:latestOrientation.gamma};if(latestLocation)s.gps={lat:latestLocation.latitude,lon:latestLocation.longitude,accuracy:latestLocation.accuracy};if(latestBattery)s.battery={level:latestBattery.level,charging:latestBattery.charging};s.captured_at=new Date().toISOString();return s;}
function bytesToBase64(bytes){const bin=[];for(let i=0;i<bytes.length;i+=8192)bin.push(String.fromCharCode.apply(null,bytes.subarray(i,i+8192)));return btoa(bin.join(''));}
async function request(url,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const headers=new Headers(options.headers||{}),owner=localStorage.getItem(OWNER_KEY);if(owner)headers.set('Authorization','Bearer '+owner);options.signal=controller.signal;Object.assign(options,{headers});const response=await fetch(url,options);if(!response.ok){const body=await response.text();let parsed={};try{parsed=JSON.parse(body)}catch(_e){}throw new Error(parsed.message||response.status+' '+response.statusText);}return JSON.parse(await response.text());}finally{clearTimeout(timer);}}
async function digestText(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function updateMotion(e){if(!telemetryEnabled)return;if(e.accelerationIncludingGravity)latestMotion={x:e.accelerationIncludingGravity.x||0,y:e.accelerationIncludingGravity.y||0,z:e.accelerationIncludingGravity.z||0};}
function updateOrientation(e){if(!telemetryEnabled)return;latestOrientation={alpha:e.alpha||0,beta:e.beta||0,gamma:e.gamma||0};}
function takeFrame(){const v=$('camera');if(!cameraStream||!v.videoWidth)return null;const s=document.createElement('canvas');s.width=16;s.height=16;s.getContext('2d').drawImage(v,0,0,16,16);const px=s.getContext('2d').getImageData(0,0,16,16).data;let lum=0;for(let i=0;i<px.length;i+=4)lum+=(px[i]+px[i+1]+px[i+2])/3;lum/=px.length/4;const c=document.createElement('canvas');const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));c.width=Math.max(1,Math.round(v.videoWidth*sc));c.height=Math.max(1,Math.round(v.videoHeight*sc));c.getContext('2d').drawImage(v,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.72);if(data.length>2800000)throw new Error('frame too large');return {name:'phone-frame.jpg',mime:'image/jpeg',data_url:data,capturedAt:new Date().toISOString(),width:c.width,height:c.height,likely_black:lum<8};}
function startBatching(){if(batchTimer||!sensorActive)return;batchTimer=setTimeout(()=>{batchTimer=null;if(document.hidden||batchInFlight||sending||pendingObs||!cameraStream){if(cameraStream&&!stopped)startBatching();return;}captureObservation('','ambient',2500);},cadenceMs);}
function stopBatching(){if(batchTimer){clearTimeout(batchTimer);batchTimer=null;}}
function pauseTelemetry(){window.removeEventListener('devicemotion',updateMotion);window.removeEventListener('deviceorientation',updateOrientation);if(locationWatchId){navigator.geolocation.clearWatch(locationWatchId);locationWatchId=null;}}
function stopMedia(){generation++;sensorActive=false;stopBatching();if(recorder&&recorder.state!=='inactive')recorder.stop();if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());if(audioStream)audioStream.getTracks().forEach(t=>t.stop());cameraStream=null;audioStream=null;recorder=null;$('camera').srcObject=null;pauseTelemetry();faceState='unknown';noFace=0;updateStartBtn();updateEarBtn();}
function audioMime(){for(const c of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c))return c;return '';}
async function recordAudioWindow(ms){const track=audioStream&&audioStream.getAudioTracks()[0];if(!track||!window.MediaRecorder)return null;const source=new MediaStream([track]),mime=audioMime(),startedAt=new Date().toISOString(),gen=generation;return new Promise((resolve,reject)=>{const pieces=[],rec=new MediaRecorder(source,mime?{mimeType:mime}:undefined);recorder=rec;rec.ondataavailable=e=>{if(e.data.size)pieces.push(e.data);};rec.onerror=()=>{if(recorder===rec)recorder=null;reject(new Error('audio capture failed'));};rec.onstop=async()=>{if(recorder===rec)recorder=null;if(gen!==generation){resolve(null);return;}if(!pieces.length){resolve(null);return;}try{const blob=new Blob(pieces,{type:rec.mimeType||mime||'audio/webm'});if(blob.size>2*1024*1024)throw new Error('audio > 2 MiB');const bytes=new Uint8Array(await blob.arrayBuffer()),audioType=(blob.type||'audio/webm').split(';')[0],ext=audioType==='audio/mp4'?'.m4a':audioType==='audio/ogg'?'.ogg':'.webm';resolve({name:'phone-audio'+ext,mime:audioType,data_url:'data:'+audioType+';base64,'+bytesToBase64(bytes),startedAt,endedAt:new Date().toISOString()});}catch(error){reject(error);}};try{rec.start(250);setTimeout(()=>{if(rec.state!=='inactive')rec.stop();},ms);}catch(error){reject(error);}});}
async function captureObservation(text,reason,audioMs){if(batchInFlight||(!sensorActive&&!text))return;batchInFlight=true;let gen=generation;try{let frame=sensorActive?takeFrame():null;if(frame&&frame.likely_black)blackStreak++;else blackStreak=0;let audio=null;if(sensorActive&&localStorage.getItem(EAR_KEY)!=='off')try{audio=await recordAudioWindow(audioMs);}catch(e){}if(gen!==generation)return;const cid=crypto.randomUUID(),attachments=[];if(frame)attachments.push(frame);if(audio)attachments.push(audio);const prompt=text||('Ambient observation batch '+(++batchSequence)+': summarize only evidence accepted from the phone as a bounded life experience; preserve uncertainty.');const envelope={schema_version:'sifta.capture.v1',capture_id:cid,kind:reason,source:'stigmergicoin-web',device_id:'browser:'+session.slice(0,16),captured_at:frame&&frame.capturedAt,telemetry:snapshotTelemetry()};await sendPayload(prompt,attachments,envelope);}catch(error){status('Not confirmed: '+error.message+'.');}finally{batchInFlight=false;updateStartBtn();if(cameraStream&&!stopped)startBatching();}}
function updateStartBtn(){const b=$('start');if(sensorActive){b.textContent='⏸';b.classList.add('is-on');}else{b.textContent='🎥';b.classList.remove('is-on');}}
function updateEarBtn(){const on=localStorage.getItem(EAR_KEY)!=='off';$('ear').textContent='👂';$('ear').classList.toggle('on',on);}
function updateVoiceBtn(){const on=localStorage.getItem(VOICE_KEY)==='on';$('voice').textContent=on?'🔊':'🔇';$('voice').classList.toggle('on',on);}
function updateFlipBtn(){$('flip').disabled=!cameraStream;}
async function enableAll(){if(sensorActive){stopMedia();return;}if(!navigator.mediaDevices){status('Camera/mic APIs unavailable.');return;}const version=++generation;let media=null;try{const earOn=localStorage.getItem(EAR_KEY)!=='off';media=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cameraFacing},width:{ideal:1280}},audio:earOn?{channelCount:1,echoCancellation:true,noiseSuppression:true}:false});if(version!==generation){media.getTracks().forEach(t=>t.stop());return;}cameraStream=media;if(media.getAudioTracks().length)audioStream=media;$('camera').srcObject=cameraStream;await $('camera').play();sensorActive=true;startTelemetry(true);startBatching();updateFlipBtn();updateStartBtn();updateEarBtn();status(earOn?'Camera + audio + telemetry active.':'Camera + telemetry active (ear off).');}catch(e){status('Camera/audio unavailable: '+e.message);}}
async function requestMotionPermission(){if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){try{const r=await DeviceMotionEvent.requestPermission();return r==='granted';}catch(e){return false;}}startTelemetry(true);return true;}
function startTelemetry(motionGranted=true){telemetryEnabled=true;if(motionGranted){window.addEventListener('devicemotion',updateMotion,{passive:true});window.addEventListener('deviceorientation',updateOrientation,{passive:true});}if(navigator.geolocation)locationWatchId=navigator.geolocation.watchPosition(p=>{if(!telemetryEnabled)return;latestLocation={latitude:Number(p.coords.latitude.toFixed(3)),longitude:Number(p.coords.longitude.toFixed(3)),accuracy:p.coords.accuracy,captured_at:new Date().toISOString()};},()=>{},{enableHighAccuracy:false,maximumAge:30000,timeout:10000});if(navigator.getBattery)navigator.getBattery().then(b=>{if(telemetryEnabled)latestBattery={level:b.level,charging:b.charging,captured_at:new Date().toISOString()};}).catch(()=>{});}
function renderObservation(rows,jobs=[]){pendingObs=false;let latestReply='';for(const row of rows){const tid=String(row.turn_id||'');if(observationTurns.has(tid)&&row.reply){latestReply=String(row.reply).trim();}}if(latestReply){const first=latestReply.split(/(?<=[.!?])\s+/)[0]||latestReply;const cap=first.length<=120?first:first.slice(0,117)+'…';const caption=$('caption');caption.textContent=cap;caption.classList.add('show');clearTimeout(caption._hideTimer);caption._hideTimer=setTimeout(()=>{caption.classList.remove('show');},6000);const voiceOn=localStorage.getItem(VOICE_KEY)==='on';if(voiceOn&&!document.hidden){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cap.slice(0,200));u.lang='ro-RO';speechSynthesis.speak(u);}catch(_e){}}}}
async function refresh(){if(polling||stopped||document.hidden)return;polling=true;try{const data=await request('/api/history?session_id='+encodeURIComponent(session)),rows=data.history||[],jobs=data.observations||[];renderObservation(rows,jobs);const active=jobs.find(job=>job.state==='running'||job.state==='queued');if(active)status('Processing batch ('+active.state+').');}catch(error){status('History unavailable: '+error.message);}finally{polling=false;}}
async function sendPayload(text,attachments=[],capture={}){if(sending)return;sending=true;$('send').disabled=true;try{const enriched={...capture};if(!Object.prototype.hasOwnProperty.call(enriched,'telemetry'))enriched.telemetry=snapshotTelemetry();const result=await request('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,text,attachments,capture:enriched})});if(!result.accepted)throw new Error(result.message||'message not accepted');if(capture.capture_id&&result.turn_id){observationTurns.set(result.turn_id,{capture_id:capture.capture_id,ts:Date.now()/1000,image_received:attachments.some(a=>a.mime.startsWith('image/')),audio_received:attachments.some(a=>a.mime.startsWith('audio/')),telemetry_received:!!(enriched.telemetry&&Object.keys(enriched.telemetry.signals||{}).length)});pendingObs=true;}if($('text').value.trim()===text.trim())$('text').value='';status(result.status==='duplicate_reconciled'?'Batch already accepted.':'Input accepted.');await refresh();}catch(error){status('Not confirmed: '+error.message+'. Draft retained.');throw error;}finally{sending=false;$('send').disabled=false;}}
async function consumePairTicket(){const marker='#pair=';if(!location.hash.startsWith(marker))return;const ticket=decodeURIComponent(location.hash.slice(marker.length));if(!ticket)return;try{const result=await request('/api/stigmergicode/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket})});if(!result.session)throw new Error('pairing did not return a session');localStorage.setItem(OWNER_KEY,result.session);history.replaceState(null,'',location.pathname+location.search);status('Owner phone paired.');}catch(error){status('Owner pairing unavailable: '+error.message);}}
</script>
<script>
$('start').onclick=enableAll;
$('ear').onclick=async()=>{const wasOn=localStorage.getItem(EAR_KEY)!=='off';localStorage.setItem(EAR_KEY,wasOn?'off':'on');updateEarBtn();if(!sensorActive)return;if(!wasOn&&!audioStream){try{audioStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});status('Ear: on.');}catch(e){status('Mic unavailable.');}}else if(wasOn&&audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null;status('Ear: off.');}};
$('voice').onclick=()=>{const on=localStorage.getItem(VOICE_KEY)==='on';localStorage.setItem(VOICE_KEY,on?'off':'on');updateVoiceBtn();if(!on){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Vocea mea e pornita.');u.lang='ro-RO';speechSynthesis.speak(u);}catch(_e){}}};
$('flip').onclick=async()=>{if(!cameraStream)return;cameraFacing=cameraFacing==='environment'?'user':'environment';try{const next=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cameraFacing},width:{ideal:1280}}});cameraStream.getVideoTracks().forEach(t=>t.stop());next.getVideoTracks().forEach(t=>cameraStream.addTrack(t));}catch(e){status('Camera switch failed.');}};
$('send').onclick=async()=>{const text=$('text').value.trim();if(!text){status('Type a message first.');return;}if(batchInFlight){status('Processing a batch.');return;}try{$('text').blur();await captureObservation(text,'owner_text',1500);}catch(_e){}};
updateEarBtn();updateVoiceBtn();updateStartBtn();updateFlipBtn();
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMedia();else refresh();});
window.addEventListener('pagehide',()=>{stopped=true;stopMedia();});
consumePairTicket();
setInterval(refresh,5000);
refresh();
</script>
</body>
</html>
